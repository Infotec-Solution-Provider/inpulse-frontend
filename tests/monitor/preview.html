<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'; form-action 'none'; base-uri 'self'"
    />
    <title>in.pulse — prévia local de acabamento</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      body {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
      }
      #preview-note {
        margin: 0;
        padding: 7px 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px 16px;
        flex-wrap: wrap;
        background: #22242b;
        color: #f7f8fa;
        font:
          12px/1.4 system-ui,
          sans-serif;
        text-align: center;
      }
      #preview-note strong {
        color: #dfd3ff;
        font-weight: 600;
      }
      #root {
        min-width: 0;
        min-height: 0;
        height: 100% !important;
      }
      @media (max-width: 600px) {
        #preview-note {
          padding: 5px 12px;
          gap: 1px;
          font-size: 10px;
        }
      }
    </style>
  </head>
  <body>
    <aside id="preview-note" aria-label="Sobre esta prévia">
      <strong>PRÉVIA LOCAL · DADOS FICTÍCIOS</strong>
      <span
        >Componentes reais da aplicação. Consultas secundárias, histórico e ações simulados; sem
        acesso a serviços reais.</span
      >
    </aside>
    <div id="root"></div>
    <script type="module" src="./preview.tsx"></script>
  </body>
</html>
